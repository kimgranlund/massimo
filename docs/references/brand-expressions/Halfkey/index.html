<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halfkey · Slide gallery</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#16171b;background:#fafaf9;--line:#d6d7da;--blue:#243aff}
*{box-sizing:border-box}body{margin:0}main{max-width:1540px;margin:auto;padding:36px clamp(18px,4vw,68px) 80px}
header{border-top:3px solid #15151a;padding:15px 0 20px}.folio,dt,.label{font:600 .72rem/1.3 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}.folio{display:flex;justify-content:space-between}h1{font-size:clamp(2.2rem,4.7vw,4.5rem);line-height:.98;letter-spacing:-.065em;margin:32px 0 14px}header p{color:#55565d;margin:0}
.filters{border-block:1px solid var(--line);padding:14px 0;display:flex;align-items:center;flex-wrap:wrap;gap:6px}.filters .label{margin-right:10px}
button{font:inherit;color:inherit;cursor:pointer;background:transparent;border:1px solid var(--line)}.chip{padding:5px 10px;border-radius:20px;font-size:.85rem}.chip[aria-pressed=true]{background:#15151a;color:white;border-color:#15151a}.chip:hover,.thumb:hover{border-color:var(--blue)}:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
nav{padding:18px 0 22px}.strip{display:flex;gap:7px;overflow-x:auto;padding:4px 3px 8px}.thumb{flex:none;width:102px;text-align:left;padding:4px;border-radius:4px;background:#fff}.thumb img{display:block;width:100%;height:54px;object-fit:contain;background:#f1f1f3}.thumb span{display:block;font:600 .73rem ui-monospace,monospace;padding:5px 1px 1px}.thumb[aria-current=true]{border:2px solid var(--blue);padding:3px;color:var(--blue)}
article{border-top:1px solid var(--line);padding-top:22px}.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px}h2{font-size:clamp(1.6rem,3vw,2.65rem);letter-spacing:-.045em;margin:4px 0 20px}.columns{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:clamp(22px,3vw,52px)}figure{margin:0;position:sticky;top:16px;align-self:start}.stage{display:grid;place-items:center;background:#eeeef0;border:1px solid var(--line);padding:clamp(8px,1.2vw,20px)}.stage img{display:block;width:100%;max-height:65vh;object-fit:contain}figcaption{display:flex;justify-content:space-between;margin-top:10px;font-size:.85rem}a{color:#303caa;text-underline-offset:3px}dl{margin:0}dt{color:#62636a}dd{margin:5px 0 16px;line-height:1.48}ol{padding-left:22px;line-height:1.45}li{margin:0 0 10px}li strong{display:block}.muted{color:#63646b}.folio span:first-child{color:#273bcb}
@media(max-width:780px){.columns{grid-template-columns:1fr}figure{position:static}.stage img{max-height:60vh}.thumb{width:84px}.thumb img{height:44px}main{padding-top:18px}}
</style>
</head>
<body><main>
<header><div class="folio"><span>Design references</span> <span>Halfkey / Book D</span></div><h1>Halfkey slide gallery</h1><p>Brand book and App Store panels, with their design specifications.</p></header>
<div id="filters" class="filters" role="group" aria-label="Category filters"><span class="label">Category</span></div>
<nav aria-label="Slides"><span class="label" id="count" role="status"></span><div id="strip" class="strip"></div></nav>
<article id="detail" aria-live="off"></article>
<noscript>Enable JavaScript to browse the gallery.</noscript>
</main>
<script src="./gallery-data.js"></script>
<script>
const base = 'manifests/';
const filters = document.querySelector('#filters'), strip = document.querySelector('#strip'), detail = document.querySelector('#detail');
function el(tag, value, cls) {
  const node = document.createElement(tag);
  if (value) node.textContent = value;
  if (cls) node.className = cls;
  return node;
}
function link(label, url) {
  const a = el('a', label);
  a.href = url;
  return a;
}
function gallery(slides) {
  let category = 'All', selected = slides[0];
  const categories = ['All', ...new Set(slides.map(s => s.category).sort())];
  function showSlide(slide) {
    selected = slide;
    for (const button of strip.children) button.setAttribute('aria-current', String(button.dataset.id === slide.id));
    const heading = el('div', null, 'titlebar');
    heading.append(el('span', slide.id + ' / ' + slide.category, 'label'));
    const title = el('h2', slide.title);
    const columns = el('div', null, 'columns'), figure = el('figure'), stage = link('', base + slide.image);
    stage.className = 'stage';
    const image = el('img'); image.src = base + slide.image; image.alt = slide.id + ' · ' + slide.title + ' (open full-size image)';
    stage.append(image);
    const caption = el('figcaption');
    caption.append(link('Full-size image', base + slide.image), link('JSON manifest', base + slide.id.toLowerCase() + '.json'));
    figure.append(stage, caption);
    const fields = el('dl');
    for (const [key, label] of [['slide_intent','Slide intent'],['strategic_value','Strategic value'],['demonstration','Demonstration'],['category','Category'],['practical_value','Practical value']]) {
      fields.append(el('dt', label), el('dd', slide[key]));
    }
    const list = el('ol');
    for (const island of slide.content_islands) {
      const item = el('li'); item.append(el('strong', island.name), island.spec); list.append(item);
    }
    const islands = el('dd'); islands.append(list); fields.append(el('dt','Content islands'), islands);
    columns.append(figure, fields); detail.replaceChildren(heading, title, columns);
  }
  function filter(next) {
    category = next;
    const matches = slides.filter(s => category === 'All' || s.category === category);
    for (const button of filters.querySelectorAll('button')) button.setAttribute('aria-pressed', String(button.dataset.category === category));
    document.querySelector('#count').textContent = matches.length + (matches.length === 1 ? ' slide' : ' slides');
    strip.replaceChildren();
    for (const slide of matches) {
      const button = el('button', null, 'thumb'), img = el('img');
      img.src = base + slide.image; img.alt = '';
      button.dataset.id = slide.id;
      button.title = slide.title; button.setAttribute('aria-label', slide.id + ' · ' + slide.title);
      button.append(img, el('span', slide.id)); button.onclick = () => showSlide(slide);
      strip.append(button);
    }
    showSlide(matches.includes(selected) ? selected : matches[0]);
    strip.querySelector('[aria-current="true"]').scrollIntoView({block:'nearest',inline:'nearest'});
  }
  for (const label of categories) {
    const button = el('button', label, 'chip'); button.dataset.category = label; button.onclick = () => filter(label); filters.append(button);
  }
  filter('All');
}
gallery(halfkeySlides);
</script></body></html>
