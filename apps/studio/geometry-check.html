    checks[`${name}.dot.radius`] = [px(before(d2).borderTopLeftRadius), rw.dotRadius];
    checks[`${name}.dots.gap`] = [r2(rect(d2).left - rect(d1).right), rw.dotsGap];
    checks[`${name}.dots.inset`] = [r2(rect(host).bottom - rect(dots).bottom), rw.dotsInset];
  };
  swiperChecks('swiper', $('swp'));
  // Image slideshow: the frame keeps its ratio; the swiper fills it.
  {
    const im = $('imgShow'), ri = resolveImage({ ...g, ratio: 'landscape', width: rect(im).width }), sw = im.querySelector('ui-swiper');
    checks['image.slideshow.height'] = [r2(rect(im).height), r2(ri.height)];
    checks['image.slideshow.fill'] = [r2(rect(sw).height), r2(ri.height)];
    checks['image.radius'] = [px(cs(im).borderTopLeftRadius), ri.radius];
    swiperChecks('image.slideshow', sw);
  }
  // Field rows: label, control, readout, description (resolveFieldRow, resolveFieldGrid).
  {
    const fp = (f, p) => f.querySelector(`:scope > [data-part=${p}]`), ctlOf = (f) => f.querySelector(':scope > ui-input');
    const rowBottom = (f) => Math.max(rect(ctlOf(f)).bottom, rect(fp(f, 'readout')).bottom);
    const st = $('fStack'), rs1 = resolveFieldRow('stacked', g);
    // The control row is as tall as its tallest item; label and readout are single lines (1.2 × font),
    // so it is the control's height at every u (checked as field.inline.rowHeight).
    const rowTop = (f) => Math.min(rect(ctlOf(f)).top, rect(fp(f, 'readout')).top);
    checks['field.stacked.rowGap'] = [r2(rowTop(st) - rect(fp(st, 'label')).bottom), rs1.rowGap];
    checks['field.stacked.columnGap'] = [r2(rect(fp(st, 'readout')).left - rect(ctlOf(st)).right), rs1.columnGap];
    checks['field.stacked.description'] = [r2(rect(fp(st, 'description')).top - rowBottom(st)), rs1.rowGap];
    checks['field.stacked.readout.minWidth'] = [px(cs(fp(st, 'readout')).minWidth), rs1.readoutMinWidth];
    checks['field.stacked.readout.width'] = [r2(rect(fp(st, 'readout')).width), rs1.readoutMinWidth];
    checks['field.stacked.unitGap'] = [px(cs(fp(st, 'label')).columnGap), rs1.unitGap];
    checks['field.stacked.control.height'] = [r2(rect(ctlOf(st)).height), ctl.height];
    const il = $('fInline'), rs2 = resolveFieldRow('inline', g);
    checks['field.inline.columnGap'] = [r2(rect(ctlOf(il)).left - rect(fp(il, 'label')).right), rs2.columnGap];
    checks['field.inline.readoutGap'] = [r2(rect(fp(il, 'readout')).left - rect(ctlOf(il)).right), rs2.columnGap];
    checks['field.inline.rowHeight'] = [r2(Math.max(rect(fp(il, 'label')).height, rect(ctlOf(il)).height, rect(fp(il, 'readout')).height)), r2(rect(ctlOf(il)).height)];
    checks['field.inline.description'] = [r2(rect(fp(il, 'description')).top - rowBottom(il)), rs2.rowGap];
    checks['field.inline.description.start'] = [r2(rect(fp(il, 'description')).left - rect(ctlOf(il)).left), 0];
    checks['field.inline.unitGap'] = [px(cs(fp(il, 'label')).columnGap), rs2.unitGap];
    checks['field.inline.readout.width'] = [r2(rect(fp(il, 'readout')).width), rs2.readoutMinWidth];
    const gr = $('fGrid'), rg = resolveFieldGrid(g), [f1, f2, f3] = gr.querySelectorAll('ui-field'), [h1, h2] = gr.querySelectorAll('h3');
    checks['fieldGrid.columnGap'] = [r2(rect(ctlOf(f1)).left - rect(fp(f2, 'label')).right), rg.columnGap];
    checks['fieldGrid.readoutGap'] = [r2(rect(fp(f1, 'readout')).left - rect(ctlOf(f1)).right), rg.columnGap];
    checks['fieldGrid.controls.aligned'] = [r2(Math.abs(rect(ctlOf(f1)).left - rect(ctlOf(f2)).left) + Math.abs(rect(ctlOf(f1)).left - rect(ctlOf(f3)).left)), 0];
    checks['fieldGrid.rowGap'] = [r2(rect(f2).top - rect(f1).bottom), rg.rowGap];
    checks['fieldGrid.readout.width'] = [r2(rect(fp(f1, 'readout')).width), rg.readoutMinWidth];
    checks['fieldGrid.label.max'] = [rect(fp(f2, 'label')).width <= rg.labelMaxFraction * rect(gr).width + 0.02 ? 1 : 0, 1];
    checks['fieldGrid.heading.first'] = [px(cs(h1).paddingTop), 0];
    checks['fieldGrid.heading.space'] = [px(cs(h2).paddingTop), rg.headingSpace];
  }
  // Choice groups: 6u rows 1u apart (7u pitch); horizontal 4u apart, wrapped lines 1u apart; gap attribute (resolveChoiceGroup).
  {
    const groupChecks = (name, el, orientation) => {
      const rg = resolveChoiceGroup(orientation, g), [a, b] = el.querySelectorAll(':scope > ui-radio, :scope > ui-checkbox');
      checks[`${name}.row`] = [r2(rect(a).height), rg.rowHeight];
      if (orientation === 'vertical') {
        checks[`${name}.gap`] = [r2(rect(b).top - rect(a).bottom), rg.gap];
        checks[`${name}.pitch`] = [r2(rect(b).top - rect(a).top), rg.pitch];
      } else checks[`${name}.columnGap`] = [r2(rect(b).left - rect(a).right), rg.columnGap];
      checks[`${name}.padding`] = [px(cs(el).paddingTop) + px(cs(el).paddingLeft) + px(cs(el).borderTopWidth), 0];
    };
    groupChecks('radioGroup.vertical', $('rgV'), 'vertical');
    groupChecks('radioGroup.horizontal', $('rgH'), 'horizontal');
    const w = $('rgW'), [w1, w2] = w.querySelectorAll('ui-radio');
    checks['radioGroup.wrap.rowGap'] = [r2(rect(w2).top - rect(w1).bottom), resolveChoiceGroup('horizontal', { unit: c.unit }).rowGap];
    groupChecks('checkboxGroup.vertical', $('cgV'), 'vertical');
    groupChecks('checkboxGroup.horizontal', $('cgH'), 'horizontal');
    const cw = $('cgW'), [c1, c2] = cw.querySelectorAll('ui-checkbox');
    checks['checkboxGroup.wrap.rowGap'] = [r2(rect(c2).top - rect(c1).bottom), resolveChoiceGroup('horizontal', { unit: c.unit }).rowGap];
  }
  for (const role of Object.keys(TYPE_ROLES)) {
    const el = box.querySelector(`[data-type="${role}"]`), t = resolveType(role, { unit: c.unit });
    checks[`type.${role}.size`] = [px(cs(el).fontSize), r2(t.size)];
    checks[`type.${role}.lineHeight`] = [px(cs(el).lineHeight), r2(t.lineHeightRatio ? t.lineHeightRatio * t.size : t.lineHeight)];
  }
  for (const l of LEVELS) {
    const el = box.querySelector(`[data-level="${l}"]`), [a, b] = el.children, h = rect(el).height;
    const want = resolveContainer(l, { ...g, height: h });
    const between = l === 'group' ? rect(b).left - rect(a).right : rect(b).top - rect(a).bottom;
    checks[`${l}.padding`] = [px(cs(el).paddingTop), want.padding];
    checks[`${l}.gap`] = [r2(between), want.gap];
    // getComputedStyle reports the declared radius; paint scales it to fit half the height.
    checks[`${l}.radius`] = [r2(Math.min(px(cs(el).borderTopLeftRadius), h / 2)), r2(want.radius)];
  }
  for (const [k, [got, want]] of Object.entries(checks)) { total++; if (Math.abs(got - want) > 0.02) fails.push(`u${c.unit}/B${c.border}/g${c.gap ?? '-'}/${c.icon} ${k}: got ${got}, want ${want}`); }
  rows.push(`u${c.unit} B${c.border} g${c.gap ?? '-'} ${c.icon}: button ${checks['button.height'][0]} font ${checks['button.font'][0]} icon ${checks['icon.size'][0]} segmented ${checks['segmented.height'][0]} btg ${checks['badge.height'][0]}/${checks['tag.height'][0]}/${checks['chip.height'][0]} card ${checks['card-md.padding'][0]}+${c.border}/${checks['card-md.gap'][0]}/${checks['card-md.radius'][0]}`);
}
document.getElementById('out').textContent = JSON.stringify({ cases: cases.length, checks: total, fails, rows }, null, 1);
</script></body></html>
