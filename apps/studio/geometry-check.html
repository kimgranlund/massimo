    checks[`type.${role}.lineHeight`] = [px(cs(el).lineHeight), r2(t.lineHeightRatio ? t.lineHeightRatio * t.size : t.lineHeight)];
  }
  for (const l of LEVELS) {
    const el = box.querySelector(`[data-level="${l}"]`), [a, b] = el.children, h = rect(el).height;
    const want = resolveContainer(l, { ...g, height: h });
    const between = l === 'group' ? rect(b).left - rect(a).right : rect(b).top - rect(a).bottom;
    checks[`${l}.padding`] = [px(cs(el).paddingTop), want.padding];
    checks[`${l}.gap`] = [r2(between), want.gap];
    // getComputedStyle reports the declared radius; paint scales it to fit half the height.
    checks[`${l}.radius`] = [r2(Math.min(px(cs(el).borderTopLeftRadius), h / 2)), r2(want.radius)];
  }
  for (const [k, [got, want]] of Object.entries(checks)) { total++; if (Math.abs(got - want) > tolerance(k, want)) fails.push(`u${c.unit}/B${c.border}/g${c.gap ?? '-'}/${c.icon} ${k}: got ${got}, want ${want}`); }
  rows.push(`u${c.unit} B${c.border} g${c.gap ?? '-'} ${c.icon}: button ${checks['button.height'][0]} font ${checks['button.font'][0]} icon ${checks['icon.size'][0]} segmented ${checks['segmented.height'][0]} btg ${checks['badge.height'][0]}/${checks['tag.height'][0]}/${checks['chip.height'][0]} card ${checks['card-md.padding'][0]}+${c.border}/${checks['card-md.gap'][0]}/${checks['card-md.radius'][0]}`);
}
document.getElementById('out').textContent = JSON.stringify({ cases: cases.length, checks: total, precision, fails, rows }, null, 1);
</script></body></html>
