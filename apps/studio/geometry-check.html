<!doctype html><html><head><title>Geometry check</title></head><body><div id="root"></div><pre id="out">pending</pre>
<script type="module">
// Renders components across sizes, borders, icon sizes and composite insets and compares
// measured lengths with the resolver. "fails": [] means CSS and resolver agree.
import './src/index.css';
import '@massimo/ui-kit/components/button/element';
import '@massimo/ui-kit/components/input/element';
import '@massimo/ui-kit/components/select/element';
import '@massimo/ui-kit/components/listbox/element';
import '@massimo/ui-kit/components/btg/element';
import '@massimo/ui-kit/components/choice/element';
import '@massimo/ui-kit/components/range/element';
import '@massimo/ui-kit/components/color/element';
import '@massimo/ui-kit/components/image/element';
import { SIZES, TYPE_ROLES, resolveType, trackFill, resolveChoice, resolveTrack, resolveSwatch, resolveButtonContents, resolveTextRun, resolveContainer, resolveBtg, resolveControl, resolveComposite, resolveField, resolveSelectTrigger } from '@massimo/ui-kit/tokens';
const ICONS = ['sm', 'md', 'lg', 'fill'];
const cases = [];
SIZES.forEach((unit, i) => { for (const border of [0, 1]) cases.push({ unit, border, icon: ICONS[(i + border) % 4], gap: (i + border) % 3 === 0 ? 2 : undefined }); });
const LEVELS = ['group', 'collection', 'tile', 'card', 'panel', 'region', 'page'];
const root = document.getElementById('root');
const r2 = (v) => Math.round(v * 100) / 100;
const px = (v) => r2(parseFloat(v));
const fails = [], rows = [];
let total = 0;
for (const c of cases) {
  const box = document.createElement('div');
  box.setAttribute('data-size', String(c.unit));
  box.style.setProperty('--ui-border', c.border);
  box.innerHTML = `<ui-button icon-size="${c.icon}"><span slot="leading"></span>Save</ui-button>
    <ui-button icon-size="${c.icon}" aria-label="x"><span slot="leading"></span></ui-button>
    <ui-button icon-size="${c.icon}">Menu<i slot="trailing" name="caret-down"></i></ui-button>
    <ui-button>Text</ui-button>
    <ui-checkbox checked>Check</ui-checkbox><ui-radio>Radio</ui-radio><ui-switch>Switch</ui-switch>
    <div style="width:400px"><ui-range value="25"></ui-range></div><ui-swatch color="red"></ui-swatch>
    <ui-input label="X"></ui-input><ui-select label="S"><ui-option>A</ui-option></ui-select>
    <ui-listbox><ui-option>Plain</ui-option><ui-option><span slot="leading"></span>Lead</ui-option></ui-listbox>
    <ui-segmented ${c.gap !== undefined ? `gap="${c.gap}"` : ''}><ui-option>One</ui-option><ui-option>Two</ui-option></ui-segmented>
    ${LEVELS.map((l) => `<ui-${l} ${c.gap !== undefined ? `gap="${c.gap}"` : ''}><span>a</span><span>b</span></ui-${l}>`).join('')}
    ${Object.keys(TYPE_ROLES).map((r) => `<span data-type="${r}" style="display:block">Ag</span>`).join('')}
    <ui-badge>3</ui-badge><ui-tag icon-size="${c.icon}"><span slot="leading"></span>Tag</ui-tag><ui-chip icon-size="${c.icon}"><span slot="leading"></span>Chip</ui-chip>
    <ui-button id="full" icon-size="${c.icon}"><span slot="leading"></span><span slot="prefix">$</span>Pay<span slot="suffix">⌘P</span><span slot="trailing"></span></ui-button>
    <ui-button id="adorn">Save<span slot="suffix">⌘S</span></ui-button>
    <ui-input id="money" label="M"><span slot="prefix">$</span><span slot="suffix">USD</span></ui-input>
    <div style="width:160px"><ui-image id="imgWide" ratio="wide"></ui-image><ui-image id="imgCustom" ratio="3/2"></ui-image><ui-image id="imgBad" ratio="evil;"></ui-image></div><ui-badge id="badgeSfx"><span slot="prefix">#</span>12<span slot="suffix">k</span></ui-badge><ui-tag id="tagTrail">Tag<i slot="trailing" name="star"></i></ui-tag><ui-chip id="chipX" removable>Remove</ui-chip><ui-chip id="chipSfx">Chip<span slot="suffix">3</span></ui-chip><ui-checkbox id="chkSfx">Check<span slot="suffix">(2)</span></ui-checkbox>`;
  root.append(box);
  await new Promise((r) => setTimeout(r, 30));
  const g = { unit: c.unit, border: c.border, iconSize: c.icon, gap: c.gap };
  const ctl = resolveControl(g), cmp = resolveComposite(g), fld = resolveField(g), trg = resolveSelectTrigger(g);
  const [btn, iconBtn, caretBtn, textBtn] = box.querySelectorAll('ui-button');
  const pc = (b) => b.querySelector('[data-part=contents]');
  const lead = btn.querySelector('[data-part=leading]'), contents = btn.querySelector('[data-part=contents]');
  const inp = box.querySelector('ui-input [data-part=control]'), tr = box.querySelector('ui-select [data-part=trigger]');
  const seg = box.querySelector('ui-segmented'), [o1, o2] = seg.querySelectorAll('ui-option');
  const cs = (el) => getComputedStyle(el), rect = (el) => el.getBoundingClientRect();
  const badge = box.querySelector('ui-badge'), tag = box.querySelector('ui-tag'), chip = box.querySelector('ui-chip');
  const rb = resolveBtg('badge', g), rt = resolveBtg('tag', g), rc = resolveBtg('chip', g);
  const slotOf = (el) => el.querySelector('[data-part=leading]'), contentsOf = (el) => el.querySelector('[data-part=contents]');
  const checks = {
    'button.height': [r2(rect(btn).height), ctl.height],
    'button.padding': [px(cs(btn).paddingTop) + px(cs(btn).borderTopWidth), ctl.padding + ctl.border],
    'button.font': [px(cs(btn).fontSize), ctl.fontSize],
    'button.radius': [px(cs(btn).borderTopLeftRadius), ctl.radius],
    'slot.width': [r2(rect(lead).width), ctl.slot],
    'slot.height': [r2(rect(lead).height), ctl.slot],
    'icon.size': [r2(rect(lead.firstElementChild).width), ctl.iconSize],
    'label.leadingOnly.start': [px(cs(pc(btn)).paddingLeft), resolveButtonContents(true, false, g).start],
    'label.leadingOnly.end': [px(cs(pc(btn)).paddingRight), resolveButtonContents(true, false, g).end],
    'label.trailingOnly.start': [px(cs(pc(caretBtn)).paddingLeft), resolveButtonContents(false, true, g).start],
    'label.trailingOnly.end': [px(cs(pc(caretBtn)).paddingRight), resolveButtonContents(false, true, g).end],
    'label.textOnly.start': [px(cs(pc(textBtn)).paddingLeft), resolveButtonContents(false, false, g).start],
    'option.textOnly.start': [px(cs(pc(box.querySelector('ui-listbox ui-option'))).paddingLeft), resolveButtonContents(false, false, g).start],
    'option.leading.start': [px(cs(pc(box.querySelectorAll('ui-listbox ui-option')[1])).paddingLeft), resolveButtonContents(true, false, g).start],
    'option.leading.end': [px(cs(pc(box.querySelectorAll('ui-listbox ui-option')[1])).paddingRight), resolveButtonContents(true, false, g).end],
    'label.textOnly.end': [px(cs(pc(textBtn)).paddingRight), resolveButtonContents(false, false, g).end],
    'contents.paddingBlock': [px(cs(contents).paddingTop), ctl.contents.paddingBlock],
    'contents.lineHeight': [px(cs(contents).lineHeight), r2(ctl.contents.lineHeight)],
    'input.editor.lineHeight': [px(cs(pc(inp)).lineHeight), r2(ctl.contents.lineHeight)],
    'select.value.lineHeight': [px(cs(pc(tr)).lineHeight), r2(ctl.contents.lineHeight)],
    'iconOnly.square': [r2(rect(iconBtn).width), ctl.height],
    'input.height': [r2(rect(inp).height), fld.height],
    'input.padding': [px(cs(inp).paddingLeft) + px(cs(inp).borderLeftWidth), ctl.padding + ctl.border],
    'input.contents.start': [px(cs(pc(inp)).paddingLeft), fld.contentsStart],
    'input.contents.end': [px(cs(pc(inp)).paddingRight), fld.contentsEnd],
    'input.contents.height': [r2(rect(pc(inp)).height), ctl.slot],
    'select.height': [r2(rect(tr).height), trg.height],
    'select.padding': [px(cs(tr).paddingLeft) + px(cs(tr).borderLeftWidth), ctl.padding + ctl.border],
    'select.paddingEnd': [px(cs(tr).paddingRight), trg.paddingEnd],
    'select.contents.start': [px(cs(pc(tr)).paddingLeft), trg.contentsStart],
    'select.contents.end': [px(cs(pc(tr)).paddingRight), trg.contentsEnd],
    'select.chevron.slot': [r2(rect(tr.querySelector('[data-part=trailing]')).width), trg.chevronSlot],
    'select.chevron.icon': [r2(rect(tr.querySelector('[data-part=trailing] > i')).width), trg.chevronIcon],
    'button.caret.icon': [r2(rect(caretBtn.querySelector('i[name=caret-down]')).width), trg.chevronIcon],
    'segmented.height': [r2(rect(seg).height), cmp.rowHeight],
    'option.height': [r2(rect(o1).height), cmp.child.height],
    'option.radius': [px(cs(o1).borderTopLeftRadius), cmp.child.radius],
    'option.gap': [r2(rect(o2).left - rect(o1).right), cmp.gap],
    'badge.height': [r2(rect(badge).height), rb.height],
    'badge.font': [px(cs(badge).fontSize), rb.fontSize],
    'badge.minWidth': [px(cs(badge).minWidth), rb.minWidth],
    'badge.width': [r2(rect(badge).width), r2(Math.max(rb.minWidth, 2 * rb.padding + 2 * rb.border + 2 * rb.bareEdge + rect(contentsOf(badge)).width - 2 * rb.bareEdge))],
    'badge.radius': [px(cs(badge).borderTopLeftRadius), r2(rb.radius)],
    'tag.height': [r2(rect(tag).height), rt.height],
    'tag.font': [px(cs(tag).fontSize), rt.fontSize],
    'tag.slot': [r2(rect(slotOf(tag)).height), rt.slot],
    'tag.icon': [r2(rect(slotOf(tag).firstElementChild).width), rt.iconSize],
    'chip.height': [r2(rect(chip).height), rc.height],
    'chip.lineHeight': [px(cs(contentsOf(chip)).lineHeight), r2(rc.lineHeight)],
    'tag.lineHeight': [px(cs(contentsOf(tag)).lineHeight), r2(rt.lineHeight)],
    'tag.paddingBlock': [px(cs(contentsOf(tag)).paddingTop), rt.paddingBlock],
    'chip.paddingBlock': [px(cs(contentsOf(chip)).paddingTop), r2(rc.paddingBlock)],
    'badge.lineHeight': [px(cs(contentsOf(badge)).lineHeight), r2(rb.lineHeight)],
    'chip.font': [px(cs(chip).fontSize), rc.fontSize],
    'chip.padding': [px(cs(chip).paddingTop), rc.padding],
    'chip.slot': [r2(rect(slotOf(chip)).height), rc.slot],
    'chip.slot.inline': [r2(rect(slotOf(chip)).width), r2(rc.slotInline)],
    'chip.icon': [r2(rect(slotOf(chip).firstElementChild).width), rc.iconSize],
    'chip.radius': [px(cs(chip).borderTopLeftRadius), r2(rc.radius)],
    'tag.radius': [px(cs(tag).borderTopLeftRadius), r2(rt.radius)],
  };
  // Construction pattern: [leading] [prefix] [contents] [suffix] [trailing] (resolveTextRun).
  const part = (el, p) => el.querySelector(`:scope > [data-part=${p}]`);
  const runChecks = (name, host, parts, opts) => {
    const want = resolveTextRun(parts, { ...g, ...(opts && { bareEdge: opts.bareEdge, slotEdge: opts.slotEdge, between: opts.between }) });
    for (const [p, w] of Object.entries(want)) {
      checks[`${name}.${p}.start`] = [px(cs(part(host, p)).paddingLeft), w.start];
      checks[`${name}.${p}.end`] = [px(cs(part(host, p)).paddingRight), w.end];
    }
  };
  const $ = (id) => box.querySelector('#' + id);
  runChecks('pattern.full', $('full'), { leading: true, prefix: true, suffix: true, trailing: true });
  runChecks('pattern.suffix', $('adorn'), { suffix: true });
  runChecks('pattern.input', part($('money'), 'control'), { prefix: true, suffix: true });
  runChecks('pattern.chip', $('chipSfx'), { suffix: true }, rc);
  runChecks('pattern.chip.leading', chip, { leading: true }, rc);
  runChecks('pattern.tag.leading', tag, { leading: true }, rt);
  runChecks('pattern.tag.trailing', $('tagTrail'), { trailing: true }, rt);
  runChecks('pattern.badge', badge, {}, rb);
  runChecks('pattern.badge.adorned', $('badgeSfx'), { prefix: true, suffix: true }, rb);
  runChecks('pattern.checkbox', $('chkSfx'), { leading: true, suffix: true }, { bareEdge: 0 });
  checks['image.ratio.preset'] = [r2(rect($('imgWide')).height), 90];
  checks['image.ratio.custom'] = [r2(rect($('imgCustom')).height), r2(160 / 1.5)];
  checks['image.ratio.invalid'] = [r2(rect($('imgBad')).height), 0];
  checks['image.ratio.noInline'] = [[$('imgWide'), $('imgCustom')].filter((el) => el.style.aspectRatio).length, 0];
  // Optical balance: edge-to-glyph equals edge-to-text on both sides, and icon-to-text is u′.
  if (c.icon !== 'fill') {
    const cr = rect(chip), ir = rect(slotOf(chip).firstElementChild), tx = contentsOf(chip), tr = rect(tx);
    checks['chip.balance.iconEdge'] = [r2(ir.left - cr.left), r2(rc.visibleEdge)];
    checks['chip.balance.textEdge'] = [r2(cr.right - (tr.right - px(cs(tx).paddingRight))), r2(rc.visibleTextEdge)];
    checks['chip.balance.iconToText'] = [r2(tr.left + px(cs(tx).paddingLeft) - ir.right), r2(rc.localUnit)];
    const xr = rect($('chipX')), xi = rect($('chipX').querySelector('[data-remove]'));
    checks['chip.balance.removeEdge'] = [r2(xr.right - xi.right), r2(rc.visibleEdge)];
  }
  checks['chip.removeIcon.sm'] = [r2(rect($('chipX').querySelector('[data-remove]')).width), r2(Math.min(rc.fontSize - 0.5 * c.unit, rc.slot))];
  checks['pattern.full.height'] = [r2(rect($('full')).height), ctl.height];
  checks['pattern.input.height'] = [r2(rect(part($('money'), 'control')).height), ctl.height];
  const choice = (sel) => box.querySelector(`${sel} [data-part=box]`);
  const rck = resolveChoice('checkbox', g), rs = resolveChoice('switch', g), rt2 = resolveTrack('range', g), rsw = resolveSwatch(g);
  const range = box.querySelector('ui-range');
  checks['checkbox.box'] = [r2(rect(choice('ui-checkbox')).height), rck.box];
  checks['checkbox.radius'] = [px(cs(choice('ui-checkbox')).borderTopLeftRadius), rck.radius];
  checks['checkbox.row'] = [r2(rect(box.querySelector('ui-checkbox')).height), rck.rowHeight];
  checks['radio.box'] = [r2(rect(choice('ui-radio')).width), rck.box];
  checks['switch.width'] = [r2(rect(choice('ui-switch')).width), rs.width];
  checks['range.height'] = [r2(rect(range).height), rt2.height];
  checks['range.track'] = [r2(rect(range.querySelector('[data-part=track]')).height), rt2.track];
  checks['range.thumb'] = [r2(rect(range.querySelector('[data-part=thumb]')).width), rt2.thumb];
  checks['range.fill'] = [r2(rect(range.querySelector('[data-part=fill]')).width), r2(trackFill('range', 0.25, rect(range.querySelector('[data-part=track]')).width, g))];
  checks['range.radius'] = [px(cs(range.querySelector('[data-part=track]')).borderTopLeftRadius), rt2.trackRadius];
  checks['swatch.size'] = [r2(rect(box.querySelector('ui-swatch')).width), rsw.size];
  for (const role of Object.keys(TYPE_ROLES)) {
    const el = box.querySelector(`[data-type="${role}"]`), t = resolveType(role, { unit: c.unit });
    checks[`type.${role}.size`] = [px(cs(el).fontSize), r2(t.size)];
    checks[`type.${role}.lineHeight`] = [px(cs(el).lineHeight), r2(t.lineHeightRatio ? t.lineHeightRatio * t.size : t.lineHeight)];
  }
  for (const l of LEVELS) {
    const el = box.querySelector(`ui-${l}`), [a, b] = el.children, h = rect(el).height;
    const want = resolveContainer(l, { ...g, height: h });
    const between = l === 'group' ? rect(b).left - rect(a).right : rect(b).top - rect(a).bottom;
    checks[`${l}.padding`] = [px(cs(el).paddingTop), want.padding];
    checks[`${l}.gap`] = [r2(between), want.gap];
    // getComputedStyle reports the declared radius; paint scales it to fit half the height.
    checks[`${l}.radius`] = [r2(Math.min(px(cs(el).borderTopLeftRadius), h / 2)), r2(want.radius)];
  }
  for (const [k, [got, want]] of Object.entries(checks)) { total++; if (Math.abs(got - want) > 0.02) fails.push(`u${c.unit}/B${c.border}/g${c.gap ?? '-'}/${c.icon} ${k}: got ${got}, want ${want}`); }
  rows.push(`u${c.unit} B${c.border} g${c.gap ?? '-'} ${c.icon}: button ${checks['button.height'][0]} font ${checks['button.font'][0]} icon ${checks['icon.size'][0]} segmented ${checks['segmented.height'][0]} btg ${checks['badge.height'][0]}/${checks['tag.height'][0]}/${checks['chip.height'][0]} card ${checks['card.padding'][0]}+${c.border}/${checks['card.gap'][0]}/${checks['card.radius'][0]}`);
}
document.getElementById('out').textContent = JSON.stringify({ cases: cases.length, checks: total, fails, rows }, null, 1);
</script></body></html>
